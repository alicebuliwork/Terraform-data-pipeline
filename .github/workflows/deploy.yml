# .github/workflows/deploy.yml
name: Terraform Deploy

on:
  push:
    branches:
      - main
      - feat-add-pipeline

permissions:
  id-token: write # CRITICAL: This is required for requesting the OIDC JWT token from AWS
  contents: read  # Required to checkout your code

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your Terraform code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. Log into AWS using OIDC (No keys required!)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Paste your role's ARN here
          role-to-assume: arn:aws:iam::550682681777:role/github-role
          aws-region: eu-north-1

      # # 3. Install Terraform on the runner
      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v3

      # # 4. Initialize Terraform (Skip backend during the very first run)
      # - name: Terraform Init
      #   run: terraform init -backend=false

      # # 5. Create the S3 Bucket and DynamoDB Table
      # - name: Terraform Apply
      #   run: terraform apply -auto-approve
